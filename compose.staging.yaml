name: smartshop-staging

services:
  api:
    image: ghcr.io/mzn17/smartshop-api:${IMAGE_TAG}
    ports: ["5000:5000"]
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://db:27017/smartstore
      - CLIENT_URL=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mongo:7.0
    volumes: ["staging_dbdata:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports: ["3000:80"]
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  staging_dbdata:
