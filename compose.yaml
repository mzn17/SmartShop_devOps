name: smartshop

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    # Toutes les variables lues par le code (grep process.env) sont transmises.
    # Les valeurs par défaut permettent un démarrage immédiat en local.
    environment:
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}
      - MONGODB_URI=mongodb://db:27017/smartstore
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-a-remplacer}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - STOCK_ALERT_THRESHOLD=${STOCK_ALERT_THRESHOLD:-8}
      - "CRON_SCHEDULE=${CRON_SCHEDULE:-0 16 * * *}"
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@smartstore.tn}
      - "MAIL_FROM=${MAIL_FROM:-SmartStore <no-reply@smartstore.tn>}"
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mongo:7.0
    # Port volontairement non publié : la base n'est joignable que par le réseau
    # interne Compose, via le nom de service "db".
    volumes:
      - dbdata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
